<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Townloc</title>
  <meta name="description" content="The page you requested could not be found on townloc.com." />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://townloc.com/404" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Townloc" />
  <meta property="og:title" content="Page Not Found | Townloc" />
  <meta property="og:description" content="The page you requested could not be found on townloc.com." />
  <meta property="og:url" content="https://townloc.com/404" />
  <meta property="og:image" content="https://townloc.com/assets/images/townloc-og.png?v=1" />
  <meta property="og:image:alt" content="Page Not Found | Townloc" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <meta name="twitter:description" content="The page you requested could not be found on townloc.com." />
  <meta name="twitter:image" content="https://townloc.com/assets/images/townloc-og.png?v=1" />
  <link rel="icon" href="/assets/images/townloc-favicon.png?v=4" />
  <link rel="apple-touch-icon" href="/assets/images/townloc-favicon.png?v=4" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --nf-ink: #111111;
      --nf-paper: #ffffff;
      --nf-muted: rgba(17, 17, 17, 0.58);
      --nf-line: rgba(17, 17, 17, 0.1);
      --nf-trust: #00b67a;
      --nf-trust-dim: rgba(0, 182, 122, 0.12);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      font-family: Outfit, system-ui, sans-serif;
      color: var(--nf-ink);
      background: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    .nf {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      background: #ffffff;
    }

    .nf-grid {
      pointer-events: none;
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(17, 17, 17, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(17, 17, 17, 0.035) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse 75% 70% at 50% 40%, #000 20%, transparent 75%);
      opacity: 0.85;
    }

    .nf-glow {
      pointer-events: none;
      position: absolute;
      width: 42vw;
      max-width: 520px;
      height: 42vw;
      max-height: 520px;
      right: -6%;
      top: 12%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--nf-trust-dim), transparent 68%);
      filter: blur(8px);
      animation: nf-pulse 8s ease-in-out infinite;
    }

    .nf-main {
      position: relative;
      z-index: 2;
      display: grid;
      align-items: center;
      min-height: 100vh;
      max-width: 1120px;
      margin: 0 auto;
      padding: 3.5rem 1.25rem 4rem;
      gap: 2.5rem;
    }

    @media (min-width: 1024px) {
      .nf-main {
        grid-template-columns: 1.05fr 0.95fr;
        padding-left: 2rem;
        padding-right: 2rem;
        gap: 3rem;
      }
    }

    .nf-kicker {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin: 0;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--nf-trust);
    }

    .nf-kicker::before {
      content: "";
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 999px;
      background: var(--nf-trust);
      box-shadow: 0 0 0 4px rgba(0, 182, 122, 0.16);
    }

    .nf-title {
      margin: 1.1rem 0 0;
      max-width: 11ch;
      font-size: clamp(2.6rem, 6vw, 4.4rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
      font-weight: 700;
      color: var(--nf-ink);
    }

    .nf-lead {
      margin: 1.15rem 0 0;
      max-width: 32rem;
      font-size: 1.05rem;
      line-height: 1.65;
      color: var(--nf-muted);
    }

    .nf-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    .nf-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      padding: 0 1.35rem;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease, color 0.2s ease;
    }

    .nf-btn:hover { transform: translateY(-1px); }

    .nf-btn-primary {
      background: #111111;
      color: #ffffff;
    }

    .nf-btn-primary:hover { background: #222222; }

    .nf-btn-ghost {
      border: 1px solid var(--nf-line);
      color: var(--nf-ink);
      background: #ffffff;
    }

    .nf-btn-ghost:hover {
      border-color: rgba(17, 17, 17, 0.28);
      background: #f7f7f7;
    }

    .nf-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      margin-top: 2.25rem;
      padding-top: 1.35rem;
      border-top: 1px solid var(--nf-line);
      font-size: 0.85rem;
      color: rgba(17, 17, 17, 0.42);
    }

    .nf-meta a {
      color: rgba(17, 17, 17, 0.72);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: color 0.2s ease, border-color 0.2s ease;
    }

    .nf-meta a:hover {
      color: #111111;
      border-bottom-color: rgba(17, 17, 17, 0.28);
    }

    .nf-panel {
      position: relative;
      min-height: 280px;
      border: 1px solid var(--nf-line);
      border-radius: 1.5rem;
      background: #ffffff;
      overflow: hidden;
      box-shadow: 0 24px 60px -36px rgba(17, 17, 17, 0.28);
    }

    .nf-watermark {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      margin: 0;
      font-size: clamp(7rem, 28vw, 12rem);
      font-weight: 800;
      letter-spacing: -0.06em;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px rgba(17, 17, 17, 0.14);
      user-select: none;
      animation: nf-rise 1s ease-out both;
    }

    .nf-chip {
      position: absolute;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--nf-line);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      font-size: 0.78rem;
      font-weight: 500;
      color: rgba(17, 17, 17, 0.72);
      animation: nf-float 6.5s ease-in-out infinite;
    }

    .nf-chip span {
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 999px;
      background: var(--nf-trust);
    }

    .nf-chip-1 { left: 1.1rem; top: 1.2rem; animation-delay: 0s; }
    .nf-chip-2 { right: 1.1rem; bottom: 1.3rem; animation-delay: 1.2s; }

    .nf-ring {
      position: absolute;
      inset: 18% 16%;
      border-radius: 50%;
      border: 1px dashed rgba(17, 17, 17, 0.12);
      animation: nf-spin 28s linear infinite;
    }

    .nf-ring::after {
      content: "";
      position: absolute;
      width: 0.65rem;
      height: 0.65rem;
      border-radius: 999px;
      background: var(--nf-trust);
      top: 8%;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 0 6px rgba(0, 182, 122, 0.12);
    }

    @keyframes nf-pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.06); }
    }

    @keyframes nf-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes nf-spin {
      to { transform: rotate(360deg); }
    }

    @keyframes nf-rise {
      from { opacity: 0; transform: translate(-50%, -42%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }

    @media (prefers-reduced-motion: reduce) {
      .nf-glow, .nf-chip, .nf-ring, .nf-watermark { animation: none; }
    }
  </style>
</head>

<body>
  <div class="nf">
    <div class="nf-grid" aria-hidden="true"></div>
    <div class="nf-glow" aria-hidden="true"></div>

    <main class="nf-main" id="main">
      <section>
        <p class="nf-kicker">Error 404</p>
        <h1 class="nf-title">This page isn&rsquo;t on the map.</h1>
        <p class="nf-lead">
          The link is broken or the page moved. Jump back home, or browse the services that help local businesses get found.
        </p>
        <div class="nf-actions">
          <a class="nf-btn nf-btn-primary" href="/">Back to Home</a>
          <a class="nf-btn nf-btn-ghost" href="/services/">View Services</a>
        </div>
        <div class="nf-meta">
          <span>Need help?</span>
          <a href="/#contact">Contact Townloc</a>
        </div>
      </section>

      <aside class="nf-panel" aria-hidden="true">
        <div class="nf-ring"></div>
        <p class="nf-watermark">404</p>
        <div class="nf-chip nf-chip-1"><span></span> Page missing</div>
        <div class="nf-chip nf-chip-2"><span></span> Route not found</div>
      </aside>
    </main>
  </div>
</body>

</html>
